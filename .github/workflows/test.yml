name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils

      - name: Python syntax check
        run: python3 -m py_compile chrome-mullvad-tray.py test_tray_status.py

      - name: Run unit tests
        run: python3 -m unittest -v test_tray_status.py

      - name: Shell syntax check
        run: |
          bash -n toggle-chrome-mullvad
          bash -n check-ip
          bash -n setup-split-nat
          bash -n install.sh
          bash -n uninstall.sh

      - name: Shellcheck
        run: shellcheck toggle-chrome-mullvad check-ip setup-split-nat install.sh uninstall.sh || true

      - name: Desktop file validation
        run: |
          desktop-file-validate chrome-mullvad-tray.desktop
          desktop-file-validate toggle-chrome-mullvad.desktop
